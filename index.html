<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Avatar</title>
  <style>
    :root { color-scheme: light dark; --fondo: #f6f6f4; --texto: #1c1c1e; --suave: #63636b; --panel: #fff; --borde: #d8d8d4; --acento: #2d5be3; --sobre-acento: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --fondo: #141416; --texto: #f2f2f4; --suave: #a5a5ae; --panel: #1f1f23; --borde: #36363c; --acento: #8aa8ff; --sobre-acento: #10131c; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--fondo); color: var(--texto); font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 420px); background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 24px; }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    p { margin: 0 0 20px; color: var(--suave); }
    label { display: block; margin-bottom: 4px; font-weight: 600; }
    input, button { width: 100%; min-height: 44px; font: inherit; border-radius: 8px; }
    input, select { padding: 8px 12px; background: transparent; color: inherit; border: 1px solid var(--borde); }
    select { width: 100%; min-height: 44px; font: inherit; border-radius: 8px; }
    option { color: #1c1c1e; background: #fff; }
    .campo { margin-bottom: 12px; }
    .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #vista { margin: 20px auto; width: min(100%, 256px); aspect-ratio: 1; border-radius: 8px; overflow: hidden; }
    #vista svg { display: block; width: 100%; height: 100%; }
    button { cursor: pointer; border: 0; background: var(--acento); color: var(--sobre-acento); font-weight: 600; }
    :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Pixel Avatar</h1>
    <p>Escribe un texto y obtén siempre el mismo avatar. Todo ocurre en tu navegador.</p>
    <div class="campo">
      <label for="texto">Texto</label>
      <input id="texto" value="Pixel" maxlength="100" autocomplete="off">
    </div>
    <label for="tamano">Cuadrícula</label>
    <select id="tamano">
      <option value="5">5 × 5</option>
      <option value="8" selected>8 × 8</option>
      <option value="12">12 × 12</option>
      <option value="16">16 × 16</option>
    </select>
    <div id="vista" role="img" aria-label="Avatar generado"></div>
    <div class="botones">
      <button id="svg" type="button">Descargar SVG</button>
      <button id="png" type="button">Descargar PNG</button>
    </div>
  </main>
  <script src="avatar.js"></script>
  <script>
    const campo = document.getElementById("texto");
    const vista = document.getElementById("vista");
    const selector = document.getElementById("tamano");
    let svgActual = "";

    function nombreArchivo(extension) {
      const base = campo.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      return (base || "avatar") + "." + extension;
    }

    function descargar(url, nombre) {
      const enlace = document.createElement("a");
      enlace.href = url;
      enlace.download = nombre;
      enlace.click();
    }

    function actualizar() {
      svgActual = PixelAvatar.generarSVG(PixelAvatar.generarAvatar(campo.value, Number(selector.value)), 512);
      vista.innerHTML = svgActual;
    }

    document.getElementById("svg").addEventListener("click", () => {
      const url = URL.createObjectURL(new Blob([svgActual], { type: "image/svg+xml" }));
      descargar(url, nombreArchivo("svg"));
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    document.getElementById("png").addEventListener("click", () => {
      const url = URL.createObjectURL(new Blob([svgActual], { type: "image/svg+xml" }));
      const imagen = new Image();
      imagen.onload = () => {
        const lienzo = document.createElement("canvas");
        lienzo.width = lienzo.height = 512;
        lienzo.getContext("2d").drawImage(imagen, 0, 0, 512, 512);
        URL.revokeObjectURL(url);
        descargar(lienzo.toDataURL("image/png"), nombreArchivo("png"));
      };
      imagen.src = url;
    });

    campo.addEventListener("input", actualizar);
    selector.addEventListener("change", actualizar);
    actualizar();
  </script>
</body>
</html>
